<!DOCTYPE html>
<html lang="en">
<head>
        <script>
            (function(){
                try {
                    if (localStorage.getItem('theme') === 'light') {
                        document.documentElement.classList.add('light-theme');
                    }
                } catch(e) {}
            })();
        </script>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>just try</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Font Awesome removed: using inline SVG icons -->
</head>
<body>

    <div class="nav-right">
        <button id="lang-en" class="lang-btn" aria-label="Switch to English">EN</button>
        <button id="lang-hi" class="lang-btn" aria-label="Switch to Hindi">HI</button>
        <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme">🌙</button>
    </div>

  <section>
  
<div class="login-box">
    <form action="/index.html">
        <h2>Login</h2>
        <div class="input-box">
                        <span class="icon">
                            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                                <rect x="3" y="5" width="18" height="14" rx="2" ry="2" stroke="currentColor" stroke-width="1.2" fill="none" />
                                <path d="M3 7l9 6 9-6" stroke="currentColor" stroke-width="1.2" fill="none" />
                            </svg>
                        </span>
            <input type="email"required>
            <label>E-mail</label>
        </div>

        <div class="input-box">
                        <span class="icon">
                            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                                <rect x="3" y="11" width="18" height="10" rx="2" stroke="currentColor" stroke-width="1.2" fill="none" />
                                <path d="M7 11V8a5 5 0 0 1 10 0v3" stroke="currentColor" stroke-width="1.2" fill="none" />
                            </svg>
                        </span>
            <input type="password"required style="margin-left: 2px ;">
            <label>Password</label>
        </div>

        <div class="remember-forget">
            <label><input type="checkbox">Remember me</label>
            <a href="#">Forget Password?</a>           
        </div>
       <button type="submit">Login</button> 
        <div class="register-link">
            <p>Don't have an account?<a href="#">Register now</a></p>
        </div>
    </form>
</div>
</section>
</body>
</html>
